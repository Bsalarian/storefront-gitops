apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storefront-api-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Bsalarian/storefront-gitops.git
    targetRevision: main
    path: deploy/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: storefront-prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true