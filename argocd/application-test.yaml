apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storefront-api-test
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Bsalarian/storefront-gitops.git
    targetRevision: main
    path: deploy/overlays/test
  destination:
    server: https://kubernetes.default.svc
    namespace: storefront-test
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true