apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: storefront-api-netpol
spec:
  podSelector:
    matchLabels:
      app: storefront-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: TCP
          port: 443