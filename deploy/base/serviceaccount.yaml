apiVersion: v1
kind: ServiceAccount
metadata:
  name: storefront-api
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: storefront-api-role
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["storefront-config"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: storefront-api-rolebinding
subjects:
  - kind: ServiceAccount
    name: storefront-api
roleRef:
  kind: Role
  name: storefront-api-role
  apiGroup: rbac.authorization.k8s.io