apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront-api
  labels:
    app: storefront-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storefront-api
  template:
    metadata:
      labels:
        app: storefront-api
  spec:
        # Blocks the pod from talking to the Kubernetes API server if compromised
        automountServiceAccountToken: false
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          fsGroup: 65532
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: storefront-api
            image: 155312145338.dkr.ecr.eu-north-1.amazonaws.com/storefront-api:v1.0.0
            imagePullPolicy: IfNotPresent
            ports:
              - name: http
                containerPort: 8080
                protocol: TCP
            env:
              - name: APP_ENV
                value: "base"
              - name: LOG_LEVEL
                value: "INFO"
              - name: AWS_REGION
                value: "eu-north-1"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: "100m"
                memory: "128Mi"
              limits:
                cpu: "250m"
                memory: "256Mi"
            livenessProbe:
              httpGet:
                path: /health
                port: http
              initialDelaySeconds: 5
              periodSeconds: 15
            readinessProbe:
              httpGet:
                path: /health
                port: http
              initialDelaySeconds: 3
              periodSeconds: 10