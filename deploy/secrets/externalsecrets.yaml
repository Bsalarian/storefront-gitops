apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: mock-secret-store
spec:
  provider:
    fake:
      data:
        - key: "/storefront/prod/db-password"
          value: "mock-demo-password-do-not-use-in-prod"
          version: "v1"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: storefront-db-secret
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: mock-secret-store
    kind: SecretStore
  target:
    name: storefront-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: "/storefront/prod/db-password"