apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: storefront-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: storefront-api
  minReplicas: 3
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: storefront-api-pdb
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: storefront-api