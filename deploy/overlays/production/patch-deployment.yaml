apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront-api
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: storefront-api
          env:
            - name: APP_ENV
              value: "production"
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"