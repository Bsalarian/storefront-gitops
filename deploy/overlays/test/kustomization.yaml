apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: storefront-test

resources:
- ../../base
- namespace.yaml

configMapGenerator:
  - name: storefront-config
    behavior: merge
    literals:
      - APP_ENV=test
      - LOG_LEVEL=DEBUG

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "150m"
            memory: "128Mi"
    target:
      kind: Deployment
      name: storefront-api
  - patch: |-
      - op: replace
        path: /spec/type
        value: LoadBalancer
    target:
      kind: Service
      name: storefront-api


images:
- name: 155312145338.dkr.ecr.eu-north-1.amazonaws.com/storefront-api
  newName: 155312145338.dkr.ecr.eu-north-1.amazonaws.com/storefront-api
  newTag: ebb4a5b61f435317b6c2c6be75eb3af1dd3f788c
