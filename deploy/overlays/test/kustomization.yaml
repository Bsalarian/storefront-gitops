apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: storefront-test

resources:
- ../../base
- namespace.yaml

configMapGenerator:
- behavior: merge
  literals:
  - APP_ENV=test
  - LOG_LEVEL=DEBUG
  name: storefront-config

patches:
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 1
    - op: replace
      path: /spec/template/spec/containers/0/resources
      value:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "150m"
          memory: "128Mi"
  target:
    kind: Deployment
    name: storefront-api
- patch: |-
    - op: replace
      path: /spec/type
      value: LoadBalancer
  target:
    kind: Service
    name: storefront-api


images:
- name: 155312145338.dkr.ecr.eu-north-1.amazonaws.com/storefront-api
  newName: 155312145338.dkr.ecr.eu-north-1.amazonaws.com/storefront-api
  newTag: e09440a918c0640bc535ab582969b472e5e4b6ff
