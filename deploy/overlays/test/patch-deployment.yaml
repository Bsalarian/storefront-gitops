apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront-api
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: storefront-api
          env:
            - name: APP_ENV
              value: "test"
            - name: LOG_LEVEL
              value: "DEBUG"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "128Mi"              